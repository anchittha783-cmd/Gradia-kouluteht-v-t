<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Pankki luokka</title>

    <script>
        // odota html sivu on ladattu ja käynnistä ohjelma
        document.addEventListener("DOMContentLoaded", function() {
            startApp();
        });

        class TiliTapahtuma {
            constructor(tapahtumaDate, tapahtuma, summa, saldoBefore) {
                this.tapahtumaDate=tapahtumaDate;
                this.tapahtuma=tapahtuma; //Nosto,Talletus
                this.summa=summa;
                this.saldoBefore=saldoBefore; // saldo ennen nostoa tai talletusta
            }

            toString() {
                let strDate = this.tapahtumaDate.toISOString(); // "2026-02-16T13:55:49".879Z
                return `|Date=${strDate}, tapahtuma=${this.tapahtuma}, summa=${this.summa}, saldoEnnenTapahtumaa=${this.saldoBefore}`;
            }      
        }

        class Pankkitili {
            constructor(accountNumber) {
                this.tilinumero = accountNumber;
                this.saldo = 0; // number
                this.historia = []; // array of TiliTapahtuma
            }

            talleta(summa) {
                if(summa<=0)  
                    return; // do nothing
                let saldoBefore = this.saldo;
                this.saldo += summa; // laita rahaa pankkiin
                // add tapahtuma to an array list
                let tapahtuma = new TiliTapahtuma(new Date(), "Talletus", summa, saldoBefore);
                this.historia.push(tapahtuma);
            }

            nosta(summa) {
                if(this.saldo-summa < 0 || summa<=0)  
                    return; // do nothing
                let saldoBefore= this.saldo;
                this.saldo -= summa; // ota rahat pois pankista
                // add tapahtuma to an array list
                let tapahtuma = new TiliTapahtuma(new Date(), "Nosto", summa, saldoBefore);
                this.historia.push(tapahtuma);                
            }

            naytaHistoria() {
                printToScreen(this.historia);
            }

            naytaTiedot() {
                let value = "Tilinumero: " + this.tilinumero
                    + ", saldo: " + this.saldo
                    + ", historia: " + this.historia;
                printToScreen(value);
            }

            suurinTapahtuma() {
                let suurinTapahtuma=null;
                for (let idx = 0; idx < this.historia.length; idx++) {
                    let tapahtuma = this.historia[idx];
                    if(suurinTapahtuma==null || tapahtuma.summa > suurinTapahtuma.summa) {
                        suurinTapahtuma=tapahtuma;
                    }
                }
                return suurinTapahtuma;
            }

            kuukausiTapahtumat(kk) {
                let lista = []; // tyhjä taulukko(array)
                for (let idx = 0; idx < this.historia.length; idx++) {
                    let tapahtuma = this.historia[idx];
                    let tapahtumaMonth = tapahtuma.tapahtumaDate.getMonth()+1;
                    if (tapahtumaMonth == kk) {
                        lista.push(tapahtuma);
                    }
                } 
                return lista;
            }

            laskeTuotto(vuosiLkm) {
                let prosentti = 0.01; // 1% vuosikorko, korkoa korolle
                let saldo = this.saldo;
                let uusiSaldo = saldo * (1 + prosentti) ** vuosiLkm;
                return uusiSaldo;
            }
        
        }



        function printToScreen(text) {
            console.log(text);
            let elem = document.getElementById("result");
            elem.innerHTML += text + "<br>";
        }

        function startApp() {
            let omaTili = new Pankkitili("FI12345-67");
            omaTili.naytaTiedot();
            printToScreen("");
            
            omaTili.talleta(12);
            omaTili.naytaTiedot();
            printToScreen("");
            
            omaTili.talleta(3);
            omaTili.naytaTiedot();
            printToScreen("");

            omaTili.nosta(7);
            omaTili.naytaTiedot();
            printToScreen("");

            omaTili.talleta(23);
            omaTili.nosta(12);
            omaTili.talleta(9);

            printToScreen("Näytä tilitapahtumat:");
            omaTili.naytaHistoria();
            
            printToScreen("");
            let suurinTapahtuma = omaTili.suurinTapahtuma();
            printToScreen("Suurin saldo historiasa: "+suurinTapahtuma.summa);

            printToScreen("");
            let kk=3;
            let tapahtumat = omaTili.kuukausiTapahtumat(kk);
            printToScreen("Kuukaudella " + kk + " on " + tapahtumat.length + " tapahtumaa");
            kk=7;
            tapahtumat = omaTili.kuukausiTapahtumat(kk);
            printToScreen("Kuukaudella " + kk + " on " + tapahtumat.length + " tapahtumaa");
            
            printToScreen("");
            let saldo = omaTili.laskeTuotto(10);
            printToScreen("Alkusaldo on "+omaTili.saldo);
            printToScreen("10v. jälkeen summa on: " + saldo);
        }


    </script>
</head>

<body>
    <div id="result"></div>
</body>

</html>
